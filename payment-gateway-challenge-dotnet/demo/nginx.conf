# Serves the demo page and proxies /api to the gateway, so the browser talks to one origin (no CORS needed).
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://payment_gateway:8080;
        proxy_set_header Host $host;
    }
}
