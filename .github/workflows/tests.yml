name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-gateway-challenge-dotnet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: payment-gateway-challenge-dotnet/global.json

      - name: Restore
        run: dotnet restore PaymentGateway.sln

      - name: Build
        run: dotnet build PaymentGateway.sln --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test PaymentGateway.sln --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory ../test-results

      - name: Write test summary
        if: always()
        working-directory: .
        run: python3 .github/scripts/test_summary.py test-results >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
