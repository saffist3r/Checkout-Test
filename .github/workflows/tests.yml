name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PaymentGateway.sln

      - name: Build
        run: dotnet build PaymentGateway.sln --no-restore --configuration Release -warnaserror

      - name: Test
        run: >
          dotnet test PaymentGateway.sln --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory test-results

      - name: Write test summary
        if: always()
        run: python3 .github/scripts/test_summary.py test-results >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results

  e2e:
    name: End-to-end user flows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Start the demo stack (UI, gateway, bank simulator)
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for the gateway
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/payments/00000000-0000-0000-0000-000000000000 || true)
            [ "$code" = "404" ] && exit 0
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.demo.yml logs
          exit 1

      - name: Run user flows
        working-directory: e2e
        run: npx playwright test

      - name: Write E2E summary
        if: always()
        working-directory: e2e
        run: |
          if [ -f test-results/results.json ]; then
            node summary.mjs test-results/results.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ❌ User flows did not run" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

      - name: Stop the demo stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down
